<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22%D8%A7%D9%84%D9%85%D9%81%D9%83%D8%B1%D8%A9%20%D8%A7%D9%84%D8%B0%D9%83%D9%8A%D8%A9%22%2C%22short_name%22%3A%22%D8%A7%D9%84%D9%85%D9%81%D9%83%D8%B1%D8%A9%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f8fafc%22%2C%22theme_color%22%3A%22%234f46e5%22%7D">

    <title id="pageTitle">المفكرة الذكية الشاملة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            -webkit-tap-highlight-color: transparent;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-gradient-to-r from-indigo-600 to-violet-700 text-white shadow-md sticky top-0 z-30">
        <div class="max-w-4xl mx-auto px-4 py-3 flex flex-col md:flex-row items-center justify-between gap-3">
            
            <div class="flex items-center space-x-3 space-x-reverse w-full md:w-auto justify-between md:justify-start">
                <div class="flex items-center space-x-2 space-x-reverse overflow-hidden">
                    <div id="headerIconContainer" class="w-10 h-10 bg-white/10 rounded-xl flex items-center justify-center backdrop-blur-sm border border-white/20 shrink-0 overflow-hidden">
                        <i id="headerIcon" class="fa-solid fa-book-bookmark text-xl text-yellow-300"></i>
                    </div>
                    <div class="truncate">
                        <h1 id="headerTitle" class="font-bold text-lg leading-tight truncate">المفكرة الذكية</h1>
                        <p id="headerSubtitle" class="text-xs text-indigo-200 truncate">إدارة النوافذ والأقسام والألبومات</p>
                    </div>
                </div>
            </div>

            <!-- الأزرار العلوية -->
            <div class="flex items-center flex-wrap justify-center gap-2">
                <button type="button" onclick="manualSaveData()" title="حفظ البيانات يدويًا" class="px-3 h-9 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl backdrop-blur-sm transition border border-white/30 flex items-center gap-1 shadow-sm active:scale-95 text-xs font-bold cursor-pointer">
                    <i class="fa-solid fa-floppy-disk text-sm"></i>
                    <span>حفظ</span>
                </button>
                <button type="button" onclick="openGuideModal()" title="دليل الاستخدام" class="w-9 h-9 bg-white/15 hover:bg-white/25 text-white rounded-xl backdrop-blur-sm transition border border-white/30 flex items-center justify-center shadow-sm active:scale-95 cursor-pointer">
                    <i class="fa-solid fa-book-open text-sm text-yellow-300"></i>
                </button>
                <button type="button" onclick="openSettingsModal()" title="لوحة التحكم والكليشة" class="w-9 h-9 bg-white/15 hover:bg-white/25 text-white rounded-xl backdrop-blur-sm transition border border-white/30 flex items-center justify-center shadow-sm active:scale-95 cursor-pointer">
                    <i class="fa-solid fa-gear text-sm"></i>
                </button>
                <button type="button" onclick="closeAppPrompt()" title="إغلاق المفكرة" class="w-9 h-9 bg-rose-500/30 hover:bg-rose-500/50 text-white rounded-xl backdrop-blur-sm transition border border-white/30 flex items-center justify-center shadow-sm active:scale-95 cursor-pointer">
                    <i class="fa-solid fa-power-off text-sm text-rose-200"></i>
                </button>
                <button type="button" onclick="openAddWindowModal()" class="bg-white/20 hover:bg-white/30 text-white font-medium text-xs px-3.5 py-2 rounded-xl backdrop-blur-sm transition border border-white/30 flex items-center gap-1.5 shadow-sm active:scale-95 cursor-pointer">
                    <i class="fa-solid fa-plus text-yellow-300"></i>
                    <span>نافذة جديدة</span>
                </button>
            </div>
        </div>

        <!-- Windows / Tabs Navigation Bar -->
        <div class="bg-indigo-900/40 border-t border-white/10 px-4 py-2">
            <div id="windowsTabsContainer" class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1"></div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-2xl w-full mx-auto p-4 pb-28">
        <div id="currentWindowHeader" class="mb-4 flex items-center justify-between bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100"></div>
        <div id="itemsContainer" class="space-y-4"></div>
        <div id="photoAlbumContainer" class="mt-6 pt-4 border-t border-slate-200"></div>

        <div id="emptyState" class="hidden flex-col items-center justify-center py-16 text-center">
            <div class="w-20 h-20 bg-indigo-50 rounded-full flex items-center justify-center text-indigo-400 mb-4 shadow-inner">
                <i class="fa-solid fa-folder-open text-3xl"></i>
            </div>
            <h3 class="font-bold text-slate-700 text-lg mb-1">المفكرة فارغة حالياً</h3>
            <p class="text-slate-400 text-xs max-w-xs mb-6">قم بإنشاء نافذتك الأولى وابدأ بتنظيم أفكارك وعناصرك وصورك بالطريقة التي تحبها.</p>
            <button type="button" onclick="openAddWindowModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-5 py-2.5 rounded-xl shadow-md transition active:scale-95 cursor-pointer">
                + إضافة أول نافذة
            </button>
        </div>
    </main>

    <!-- Floating Action Button -->
    <div id="fabContainer" class="fixed bottom-6 left-0 right-0 max-w-2xl mx-auto px-4 pointer-events-none z-20 flex justify-between items-center">
        <button type="button" onclick="openPhotoPickerModal()" class="pointer-events-auto bg-gradient-to-r from-violet-500 to-purple-600 hover:from-violet-600 hover:to-purple-700 text-white font-bold px-4 py-3.5 rounded-2xl shadow-lg shadow-purple-500/30 flex items-center gap-2 transition transform active:scale-90 border-2 border-white text-xs cursor-pointer">
            <i class="fa-solid fa-images text-lg"></i>
            <span>ألبوم الصور والملفات</span>
        </button>
        <button type="button" onclick="openAddItemModal()" class="pointer-events-auto bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold w-14 h-14 rounded-2xl shadow-lg shadow-teal-500/30 flex items-center justify-center transition transform active:scale-90 border-2 border-white cursor-pointer">
            <i class="fa-solid fa-plus text-2xl"></i>
        </button>
    </div>

    <!-- Universal Modal -->
    <div id="appModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden transition-opacity opacity-0">
        <div class="bg-white w-full max-w-sm rounded-3xl shadow-2xl overflow-hidden transform scale-95 transition-transform duration-200" id="modalBox">
            <div class="bg-slate-50 px-5 py-4 border-b border-slate-100 flex items-center justify-between">
                <h3 id="modalTitle" class="font-bold text-slate-800 text-base">عنوان النافذة</h3>
                <button type="button" onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-200/60 hover:bg-slate-200 text-slate-500 flex items-center justify-center transition cursor-pointer">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="p-5 max-h-[75vh] overflow-y-auto" id="modalBody"></div>
        </div>
    </div>

    <!-- Image Fullscreen Lightbox Modal -->
    <div id="imageLightbox" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-4" onclick="closeLightbox()">
        <div class="relative max-w-lg w-full flex flex-col items-center">
            <button type="button" onclick="closeLightbox()" class="absolute -top-12 left-0 text-white bg-white/10 hover:bg-white/20 w-10 h-10 rounded-full flex items-center justify-center transition cursor-pointer">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <img id="lightboxImg" src="" alt="صورة مكبرة" class="max-h-[80vh] max-w-full rounded-2xl object-contain shadow-2xl">
            <p id="lightboxCaption" class="text-white text-xs mt-4 text-center font-medium"></p>
        </div>
    </div>

    <!-- Custom Notification Toast -->
    <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 bg-slate-900/90 text-white text-xs px-4 py-2.5 rounded-xl shadow-xl backdrop-blur-md transition-all duration-300 opacity-0 pointer-events-none transform -translate-y-4">
        رسالة تنبيه
    </div>

    <script>
        const presetGallery = [
            { id: 'p1', title: 'طبيعة وجبال', url: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=600&q=80' },
            { id: 'p2', title: 'غروب البحر', url: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80' },
            { id: 'p3', title: 'غابة خضراء', url: 'https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=600&q=80' },
            { id: 'p4', title: 'هندسة وعمارة', url: 'https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=600&q=80' },
            { id: 'p5', title: 'قهوة وكتاب', url: 'https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=600&q=80' },
            { id: 'p6', title: 'تقنية وتطوير', url: 'https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=600&q=80' },
            { id: 'p7', title: 'زهور وربيع', url: 'https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=600&q=80' },
            { id: 'p8', title: 'سماء ونجوم', url: 'https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?auto=format&fit=crop&w=600&q=80' }
        ];

        let appData = {
            settings: {
                appName: "المفكرة الذكية الشاملة",
                appSubtitle: "إدارة النوافذ والأقسام والألبومات",
                appLogo: ""
            },
            windows: []
        };

        let currentWindowId = null;
        const STORAGE_KEY = 'smart_dynamic_persistent_app_v18_fixed';

        // تخزين الملفات نفسها في IndexedDB؛ أما localStorage فيحفظ بياناتها فقط.
        const FILE_DB_NAME = 'smart_dynamic_files_db';
        const FILE_STORE_NAME = 'files';
        let fileDbPromise = null;
        const activeFileUrls = new Map();

        function openFileDatabase() {
            if (!('indexedDB' in window)) {
                return Promise.reject(new Error('المتصفح لا يدعم التخزين المحلي للملفات'));
            }
            if (!fileDbPromise) {
                fileDbPromise = new Promise((resolve, reject) => {
                    const request = indexedDB.open(FILE_DB_NAME, 1);
                    request.onupgradeneeded = () => {
                        const db = request.result;
                        if (!db.objectStoreNames.contains(FILE_STORE_NAME)) {
                            db.createObjectStore(FILE_STORE_NAME, { keyPath: 'id' });
                        }
                    };
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error || new Error('تعذر فتح قاعدة الملفات'));
                });
            }
            return fileDbPromise;
        }

        async function storeFileBlob(id, file) {
            const db = await openFileDatabase();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(FILE_STORE_NAME, 'readwrite');
                tx.objectStore(FILE_STORE_NAME).put({ id, blob: file, name: file.name, type: file.type });
                tx.oncomplete = () => resolve(true);
                tx.onerror = () => reject(tx.error || new Error('تعذر حفظ الملف'));
                tx.onabort = () => reject(tx.error || new Error('تم إلغاء حفظ الملف'));
            });
        }

        async function getStoredFile(id) {
            const db = await openFileDatabase();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(FILE_STORE_NAME, 'readonly');
                const request = tx.objectStore(FILE_STORE_NAME).get(id);
                request.onsuccess = () => resolve(request.result || null);
                request.onerror = () => reject(request.error || new Error('تعذر قراءة الملف'));
            });
        }

        async function removeStoredFile(id) {
            if (!id) return;
            try {
                const db = await openFileDatabase();
                await new Promise((resolve, reject) => {
                    const tx = db.transaction(FILE_STORE_NAME, 'readwrite');
                    tx.objectStore(FILE_STORE_NAME).delete(id);
                    tx.oncomplete = resolve;
                    tx.onerror = () => reject(tx.error);
                });
            } catch (error) {
                console.warn('تعذر حذف الملف من قاعدة التخزين', error);
            }
            const oldUrl = activeFileUrls.get(id);
            if (oldUrl) {
                URL.revokeObjectURL(oldUrl);
                activeFileUrls.delete(id);
            }
        }

        function getSerializableAppData() {
            // لا نحفظ روابط blob المؤقتة؛ نحفظ معرّف الملف فقط.
            const copy = JSON.parse(JSON.stringify(appData));
            (copy.windows || []).forEach(win => {
                (win.photos || []).forEach(photo => {
                    if (photo.storageId) delete photo.url;
                });
            });
            return copy;
        }

        async function restoreStoredFiles() {
            let changed = false;
            for (const win of (appData.windows || [])) {
                for (const photo of (win.photos || [])) {
                    if (!photo.storageId) continue;
                    try {
                        const savedFile = await getStoredFile(photo.storageId);
                        if (savedFile && savedFile.blob) {
                            const oldUrl = activeFileUrls.get(photo.storageId);
                            if (oldUrl) URL.revokeObjectURL(oldUrl);
                            const url = URL.createObjectURL(savedFile.blob);
                            activeFileUrls.set(photo.storageId, url);
                            photo.url = url;
                        } else {
                            photo.url = '';
                            photo.fileMissing = true;
                        }
                    } catch (error) {
                        console.error('تعذر استعادة الملف:', error);
                        photo.url = '';
                        photo.fileMissing = true;
                    }
                    changed = true;
                }
            }
            if (changed) render();
        }

        function loadData() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    appData = JSON.parse(saved);
                    if (!appData.settings) {
                        appData.settings = {
                            appName: "المفكرة الذكية الشاملة",
                            appSubtitle: "إدارة النوافذ والأقسام والألبومات",
                            appLogo: ""
                        };
                    }
                }
            } catch (e) {
                console.error("Error loading data", e);
            }

            if (!appData.windows || appData.windows.length === 0) {
                appData.windows = [];
                currentWindowId = null;
            } else {
                currentWindowId = appData.windows[0].id;
            }
        }

        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(getSerializableAppData()));
            } catch (e) {
                console.error("Error saving data", e);
                showToast('تنبيه: مساحة التخزين ممتلئة', 'error');
            }
            render();
        }

        function manualSaveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(getSerializableAppData()));
                showToast('تم حفظ التغييرات بنجاح! 💾');
            } catch (e) {
                showToast('فشل الحفظ', 'error');
            }
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            if(!toast) return;
            toast.innerText = message;
            toast.className = `fixed top-20 left-1/2 -translate-x-1/2 z-50 text-white text-xs px-4 py-2.5 rounded-xl shadow-xl backdrop-blur-md transition-all duration-300 opacity-100 transform translate-y-0 ${type === 'error' ? 'bg-rose-600/90' : 'bg-slate-900/90'}`;
            setTimeout(() => {
                toast.className = `fixed top-20 left-1/2 -translate-x-1/2 z-50 text-white text-xs px-4 py-2.5 rounded-xl shadow-xl backdrop-blur-md transition-all duration-300 opacity-0 pointer-events-none transform -translate-y-4`;
            }, 3000);
        }

        function render() {
            renderBranding();
            renderTabs();
            renderCurrentWindow();
        }

        function renderBranding() {
            const s = appData.settings;
            document.getElementById('pageTitle').innerText = s.appName;
            document.getElementById('headerTitle').innerText = s.appName;
            document.getElementById('headerSubtitle').innerText = s.appSubtitle;
            
            const iconContainer = document.getElementById('headerIconContainer');
            if (s.appLogo) {
                iconContainer.innerHTML = `<img src="${s.appLogo}" alt="شعار" class="w-full h-full object-cover">`;
            } else {
                iconContainer.innerHTML = `<i class="fa-solid fa-book-bookmark text-xl text-yellow-300"></i>`;
            }
        }

        function renderTabs() {
            const container = document.getElementById('windowsTabsContainer');
            if(!container) return;
            container.innerHTML = '';

            if (appData.windows.length === 0) {
                container.innerHTML = '<span class="text-xs text-indigo-200 py-1">لا توجد نوافذ، انقر على نافذة جديدة</span>';
                return;
            }

            appData.windows.forEach(win => {
                const isActive = win.id === currentWindowId;
                const tab = document.createElement('button');
                tab.type = 'button';
                tab.className = `whitespace-nowrap px-3.5 py-1.5 rounded-xl text-xs font-semibold transition flex items-center gap-1.5 cursor-pointer ${
                    isActive 
                    ? 'bg-white text-indigo-700 shadow-sm' 
                    : 'bg-indigo-800/50 text-indigo-100 hover:bg-indigo-800'
                }`;
                tab.innerHTML = `<i class="fa-solid fa-window-maximize text-[10px]"></i><span>${escapeHtml(win.name)}</span>`;
                tab.onclick = () => {
                    currentWindowId = win.id;
                    render();
                };
                container.appendChild(tab);
            });
        }

        function renderCurrentWindow() {
            const currentWin = appData.windows.find(w => w.id === currentWindowId);
            const headerEl = document.getElementById('currentWindowHeader');
            const itemsEl = document.getElementById('itemsContainer');
            const albumEl = document.getElementById('photoAlbumContainer');
            const emptyEl = document.getElementById('emptyState');
            const fabEl = document.getElementById('fabContainer');

            if (!currentWin) {
                if(headerEl) headerEl.innerHTML = '';
                if(itemsEl) itemsEl.innerHTML = '';
                if(albumEl) albumEl.innerHTML = '';
                if(emptyEl) {
                    emptyEl.classList.remove('hidden');
                    emptyEl.classList.add('flex');
                }
                if(fabEl) fabEl.style.display = 'none';
                return;
            }

            if(emptyEl) {
                emptyEl.classList.remove('flex');
                emptyEl.classList.add('hidden');
            }
            if(fabEl) fabEl.style.display = 'flex';

            if (!currentWin.photos) currentWin.photos = [];

            if(headerEl) {
                headerEl.innerHTML = `
                    <div class="flex items-center gap-2 overflow-hidden">
                        <div class="w-8 h-8 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center shrink-0">
                            <i class="fa-solid fa-folder-open text-sm"></i>
                        </div>
                        <div class="truncate">
                            <h2 class="font-bold text-slate-800 text-sm truncate">${escapeHtml(currentWin.name)}</h2>
                            <span class="text-[10px] text-slate-400">${currentWin.items.length} عناصر • ${currentWin.photos.length} ملفات</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-1 shrink-0">
                        <button type="button" onclick="openEditWindowModal('${currentWin.id}')" title="تعديل النافذة" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-amber-50 text-slate-600 hover:text-amber-600 flex items-center justify-center transition cursor-pointer">
                            <i class="fa-solid fa-pen text-xs"></i>
                        </button>
                        <button type="button" onclick="deleteWindowPrompt('${currentWin.id}')" title="حذف النافذة" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-rose-50 text-slate-600 hover:text-rose-600 flex items-center justify-center transition cursor-pointer">
                            <i class="fa-solid fa-trash text-xs"></i>
                        </button>
                    </div>
                `;
            }

            if(itemsEl) {
                itemsEl.innerHTML = '';
                if (currentWin.items.length === 0) {
                    itemsEl.innerHTML = `
                        <div class="bg-white rounded-2xl p-6 text-center border border-dashed border-slate-200">
                            <p class="text-xs text-slate-400 mb-2">هذه النافذة لا تحتوي على عناصر رئيسية حالياً.</p>
                            <button type="button" onclick="openAddItemModal()" class="text-indigo-600 hover:text-indigo-700 text-xs font-bold bg-indigo-50 px-3.5 py-1.5 rounded-xl cursor-pointer">
                                + إضافة عنصر رئيسي
                            </button>
                        </div>
                    `;
                } else {
                    currentWin.items.forEach((item, index) => {
                        const itemCard = document.createElement('div');
                        itemCard.className = 'bg-white rounded-2xl p-4 shadow-sm border border-slate-100 transition';
                        
                        let childrenHtml = '';
                        if (item.children && item.children.length > 0) {
                            item.children.forEach((child) => {
                                childrenHtml += `
                                    <div class="flex items-center justify-between bg-slate-50 hover:bg-slate-100/80 px-3 py-2 rounded-xl text-xs transition border border-slate-100/60 group">
                                        <div class="flex items-center gap-2 overflow-hidden">
                                            <span class="w-1.5 h-1.5 rounded-full bg-indigo-400 shrink-0"></span>
                                            <span class="text-slate-700 font-medium truncate">${escapeHtml(child.title)}</span>
                                        </div>
                                        <div class="flex items-center gap-1 opacity-80 group-hover:opacity-100 shrink-0">
                                            <button type="button" onclick="openEditSubItemModal('${item.id}', '${child.id}')" class="w-6 h-6 rounded-md hover:bg-white text-slate-400 hover:text-indigo-600 flex items-center justify-center transition cursor-pointer">
                                                <i class="fa-solid fa-pen text-[10px]"></i>
                                            </button>
                                            <button type="button" onclick="deleteSubItem('${item.id}', '${child.id}')" class="w-6 h-6 rounded-md hover:bg-white text-slate-400 hover:text-rose-600 flex items-center justify-center transition cursor-pointer">
                                                <i class="fa-solid fa-trash text-[10px]"></i>
                                            </button>
                                        </div>
                                    </div>
                                `;
                            });
                        } else {

                        } else if(photo.type === 'pdf') {
                            previewContent = photo.url

                                : `<div class="aspect-video w-full rounded-xl bg-amber-50 flex flex-col items-center justify-center text-amber-700 text-xs gap-2"><i class="fa-solid fa-file-pdf text-3xl"></i><span>الملف غير متاح — أعد رفع PDF</span></div>`;

                            ${previewContent}

                                <span class="text-xs font-semibold text-slate-700 truncate">${escapeHtml(photo.caption || 'ملف')}</span>

                                </button>

        function showModal(title, htmlContent) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerHTML = htmlContent;
            const modal = document.getElementById('appModal');
            const box = document.getElementById('modalBox');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                box.classList.remove('scale-95');
                box.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('appModal');
            const box = document.getElementById('modalBox');
            modal.classList.add('opacity-0');
            box.classList.remove('scale-100');
            box.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        function openLightbox(url, caption) {
            if(url.startsWith('data:image') || url.startsWith('http')) {
                document.getElementById('lightboxImg').src = url;
                document.getElementById('lightboxCaption').innerText = caption;
                document.getElementById('imageLightbox').classList.remove('hidden');
            } else {
                showToast('هذا ملف مستند أو فيديو', 'success');
            }
        }

        function closeLightbox() {
            document.getElementById('imageLightbox').classList.add('hidden');
        }

        let tempUploadedLogo = appData.settings.appLogo || '';

        function handleLogoUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                tempUploadedLogo = e.target.result;
                const container = document.getElementById('logoPreviewContainer');
                if (container) {
                    container.innerHTML = `<img src="${tempUploadedLogo}" class="w-full h-full object-cover">`;
                }
            };
            reader.readAsDataURL(file);
        }

        function removeLogo() {
            tempUploadedLogo = '';
            const container = document.getElementById('logoPreviewContainer');
            if (container) {
                container.innerHTML = `<i class="fa-solid fa-image text-slate-400"></i>`;
            }
        }

        function saveSettings(e) {
            e.preventDefault();
            const appName = document.getElementById('settingAppName').value.trim();
            const appSubtitle = document.getElementById('settingAppSubtitle').value.trim();
            if (!appName) return;

            appData.settings.appName = appName;
            appData.settings.appSubtitle = appSubtitle;
            appData.settings.appLogo = tempUploadedLogo;

            saveData();
            closeModal();
            showToast('تم تحديث الإعدادات بنجاح');
        }

        function updateItem(e, itemId) {

            if (!title) return;
            const win = appData.windows.find(w => w.id === currentWindowId);
            if (!win) return;
            const item = win.items.find(i => i.id === itemId);

            win.items = win.items.filter(i => i.id !== itemId);

        function openAddSubItemModal(itemId) {

        function saveNewSubItem(e, itemId) {
            e.preventDefault();
            const title = document.getElementById('subItemNameInput').value.trim();
            if (!title) return;
            const win = appData.windows.find(w => w.id === currentWindowId);

                <form onsubmit="updateSubItem(event, '${itemId}', '${subId}')" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1.5">اسم الفرع الجديد</label>
                        <input type="text" id="editSubNameInput" required value="${escapeHtml(sub.title)}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-indigo-600 bg-slate-50">
                    </div>
                    <div class="flex items-center justify-end gap-2 pt-2">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-500 hover:bg-slate-100 transition cursor-pointer">إلغاء</button>
                        <button type="submit" class="px-5 py-2 rounded-xl text-xs font-semibold bg-indigo-600 hover:bg-indigo-700 text-white shadow-md transition cursor-pointer">تحديث</button>
                    </div>
                </form>
            `);
        }

        function updateSubItem(e, itemId, subId) {
            e.preventDefault();
            const title = document.getElementById('editSubNameInput').value.trim();
            if (!title) return;
            const win = appData.windows.find(w => w.id === currentWindowId);
            if (!win) return;
            const item = win.items.find(i => i.id === itemId);
            if (!item) return;
            const sub = item.children.find(s => s.id === subId);
            if (sub) {
                sub.title = title;
                saveData();
                closeModal();
                showToast('تم التحديث بنجاح');
            }
        }

        function deleteSubItem(itemId, subId) {
            const win = appData.windows.find(w => w.id === currentWindowId);
            if (!win) return;
            const item = win.items.find(i => i.id === itemId);
            if (!item) return;
            item.children = item.children.filter(s => s.id !== subId);
            saveData();
            showToast('تم الحذف بنجاح');
        }

        function openPhotoPickerModal() {
            showModal('إضافة صور أو ملفات (فيديو / PDF)', `
                <div class="space-y-4">
                    <div class="bg-indigo-50 border border-indigo-100 p-4 rounded-2xl text-center">
                        <div class="w-12 h-12 bg-indigo-600 text-white rounded-xl flex items-center justify-center mx-auto mb-2 shadow-md">
                            <i class="fa-solid fa-cloud-arrow-up text-xl"></i>
                        </div>
                        <h4 class="font-bold text-slate-800 text-xs mb-1">اختر صورة أو فيديو أو ملف PDF</h4>
                        <p class="text-[10px] text-slate-500 mb-3">حفظ آمن ومستقر لجميع الملفات والفيديوهات</p>
                        <label class="inline-block bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl cursor-pointer shadow-md transition active:scale-95">
                            <i class="fa-solid fa-upload ml-1"></i> اختر من الجهاز
                            <input type="file" accept="image/*,video/*,.pdf,.m4v,.webm,.avi,.mov" class="hidden" onchange="handleAnyFileUpload(event)">
                        </label>
                    </div>

                    <div class="relative flex py-1 items-center">
                        <div class="flex-grow border-t border-slate-200"></div>
                        <span class="flex-shrink mx-3 text-slate-400 text-[11px]">أو اختر من المعرض الجاهز</span>
                        <div class="flex-grow border-t border-slate-200"></div>
                    </div>

                    <div class="grid grid-cols-2 gap-2 max-h-48 overflow-y-auto p-1">
                        ${presetGallery.map(p => `
                            <div onclick="selectPresetPhoto('${p.url}', '${p.title}')" class="cursor-pointer bg-slate-50 hover:bg-indigo-50 border border-slate-200 rounded-xl p-2 transition flex flex-col items-center group">
                                <img src="${p.url}" alt="${p.title}" class="w-full h-16 object-cover rounded-lg mb-1">
                                <span class="text-[10px] font-bold text-slate-700 truncate w-full text-center">${p.title}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `);
        }

        // رفع الملفات وحفظها بشكل دائم في IndexedDB.
        async function handleAnyFileUpload(event) {
            const input = event.target;
            const file = input.files && input.files[0];
            if (!file) return;

            const win = appData.windows.find(w => w.id === currentWindowId);
            if (!win) return;
            if (!win.photos) win.photos = [];

            const extension = (file.name.split('.').pop() || '').toLowerCase();
            let fileType = 'image';
            if (file.type.startsWith('video/') || ['mp4', 'mov', 'avi', 'm4v', 'webm'].includes(extension)) {
                fileType = 'video';
            } else if (file.type === 'application/pdf' || extension === 'pdf') {
                fileType = 'pdf';
            } else if (!file.type.startsWith('image/')) {
                showToast('نوع الملف غير مدعوم. اختر صورة أو فيديو أو PDF', 'error');
                input.value = '';
                return;
            }

            const fileId = 'stored_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
            try {
                // الفيديو وPDF وكل صورة أكبر من 2 ميغابايت تحفظ كملف حقيقي.
                if (fileType !== 'image' || file.size > 2 * 1024 * 1024) {
                    await storeFileBlob(fileId, file);
                    const localUrl = URL.createObjectURL(file);
                    activeFileUrls.set(fileId, localUrl);
                    win.photos.push({
                        id: fileId,
                        storageId: fileId,
                        url: localUrl,
                        caption: file.name,
                        type: fileType
                    });
                } else {
                    const dataUrl = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = () => resolve(reader.result);
                        reader.onerror = () => reject(reader.error || new Error('تعذرت قراءة الصورة'));
                        reader.readAsDataURL(file);
                    });
                    win.photos.push({ id: fileId, url: dataUrl, caption: file.name, type: 'image' });
                }

                saveData();
                closeModal();
                showToast(fileType === 'video' ? 'تم حفظ الفيديو بنجاح' : fileType === 'pdf' ? 'تم حفظ ملف PDF بنجاح' : 'تمت إضافة الصورة بنجاح');
            } catch (error) {
                console.error('Upload error:', error);
                showToast('تعذر حفظ الملف. تأكد من توفر مساحة في الجهاز ثم حاول مجددًا', 'error');
            } finally {
                input.value = '';
            }
        }

        function selectPresetPhoto(url, title) {
            const win = appData.windows.find(w => w.id === currentWindowId);
            if (!win) return;
            if (!win.photos) win.photos = [];
            win.photos.push({ id: 'file_' + Date.now(), url: url, caption: title, type: 'image' });
            saveData();
            closeModal();
            showToast('تمت إضافة الصورة بنجاح');
        }

        async function deletePhoto(photoId) {
            const win = appData.windows.find(w => w.id === currentWindowId);
            if (!win) return;
            const photo = (win.photos || []).find(p => p.id === photoId);
            if (!photo) return;
            win.photos = win.photos.filter(p => p.id !== photoId);
            saveData();
            if (photo.storageId) await removeStoredFile(photo.storageId);
            showToast('تم الحذف بنجاح');
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        document.addEventListener("DOMContentLoaded", async function() {
            loadData();
            render();
            await restoreStoredFiles();
        });
    </script>
</body>
</html>
